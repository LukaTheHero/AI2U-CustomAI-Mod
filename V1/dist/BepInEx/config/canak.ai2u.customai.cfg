## AI2U Custom AI Endpoint - configuration
##
## This file lives at:
##   <game folder>\BepInEx\config\canak.ai2u.customai.cfg
##
## YOU PROBABLY DO NOT NEED TO EDIT THIS FILE.
## Everything important is editable in-game: Settings -> AI Setup, which also
## has Test buttons that go green or red so you can check your setup without
## reading a log. This file is here for the settings the UI does not expose,
## and so you can see what the defaults are.
##
## BepInEx rewrites this file on launch, so if you edit it before ever running
## the game your comments may be reformatted. That is normal - your VALUES are
## preserved. Close the game before editing; it only reads this at startup.

[General]

## Route NPC dialogue to your own OpenAI-compatible endpoint instead of the
## AI2U game server. Set to false to restore completely stock behaviour.
# Setting type: Boolean
# Default value: true
Enabled = true

[Endpoint]

## Any OpenAI-compatible base URL. The path is appended for you, and if your
## provider wants a slightly different shape the Test button will find it and
## correct this line for you.
##   OpenRouter  https://openrouter.ai/api/v1
##   OpenAI      https://api.openai.com/v1
##   LinkAPI     https://api.linkapi.ai/v1
##   Local       http://localhost:1234/v1     (LM Studio, llama.cpp, ...)
# Setting type: String
# Default value: https://openrouter.ai/api/v1
BaseUrl = https://openrouter.ai/api/v1

## >>> YOUR KEY GOES HERE (or type it in-game under AI Setup) <<<
## Get one at https://openrouter.ai/keys - it starts with "sk-or-v1-".
## Sent as 'Authorization: Bearer <key>'. Leave empty for a local endpoint
## that does not check keys.
# Setting type: String
# Default value:
ApiKey =

## Which model answers as the character. Must match your provider's exact id.
## Known-good on OpenRouter:
##   google/gemini-3.6-flash          fast, cheap, good instruction-following
##   google/gemini-3.1-pro-preview    smarter, noticeably pricier
##   anthropic/claude-sonnet-5        strong roleplay
## Smaller models drift out of the required JSON shape more often - if replies
## start failing, raise RetriesOnBadJson below.
# Setting type: String
# Default value: google/gemini-3.6-flash
Model = google/gemini-3.6-flash

[Memory]

## How much conversation she keeps before the game deletes her oldest lines.
## This is MEMORY, not reply length. The stock game caps this at 3072 tokens,
## which is why vanilla NPCs forget the start of a long talk.
## A ceiling, not a reservation: cost only grows as history actually fills.
## Keep it under your model's context window (Gemini 3.6 Flash: 1048576).
# Setting type: Int32
# Default value: 500000
HistoryMaxTokens = 500000

[Sampling]

## Higher is more creative and less predictable. 0.7-1.0 is a sane range.
# Setting type: Single
# Default value: 0.9
Temperature = 0.9

## Longest single reply, in tokens. This is OUTPUT LENGTH, not memory.
## Reasoning models burn hidden thinking tokens against this budget before
## writing anything, so do not drop it below ~1500 or you may get empty
## replies. Most providers reject values above their own output cap
## (Gemini 3.6 Flash: 65536).
# Setting type: Int32
# Default value: 3000
MaxTokens = 3000

## How many times to re-ask when the model returns malformed JSON.
## Raise to 3-4 if you use a small or local model.
# Setting type: Int32
# Default value: 2
RetriesOnBadJson = 2

## Send reasoning.exclude so chain-of-thought never leaks into her dialogue.
## Required for Gemini 3.x and other reasoning models, which otherwise narrate
## their thinking out loud instead of speaking in character.
## Note this is an OpenRouter extension; strict providers may reject it, in
## which case set it to false.
# Setting type: Boolean
# Default value: true
HideReasoning = true

## Ask the provider to guarantee valid JSON. Tightens output, but some
## endpoints reject the parameter outright - leave false if replies stop
## arriving after you enable it.
# Setting type: Boolean
# Default value: false
ForceJsonMode = false

[Schema]

## Snap out-of-range values onto ones the game engine actually understands.
## The valid lists are read live from the running game, so this follows
## whichever level and character you are in. Turn off only to see what your
## model emits raw. Leaving this off will make her ignore commands.
# Setting type: Boolean
# Default value: true
ClampToAllowedValues = true

[Voice]

## Speak lines with the game's built-in on-device voice.
## Required with a custom endpoint: the stock game plays audio that the AI2U
## server bundles with each reply, and your own endpoint cannot supply that,
## so without this she would be silent. Quality is modest - see [GrokTTS].
# Setting type: Boolean
# Default value: true
ForceLocalVoice = true

[GrokTTS]

## OPTIONAL upgrade. Speak her lines with a cloud text-to-speech service
## instead of the on-device voice. Much better quality, but it needs its own
## API key and is billed per character by that provider - a second meter on
## top of your text provider.
## If a request fails, that line falls back to the local voice automatically.
## Switch this in-game under AI Setup, or with F8, without restarting.
# Setting type: Boolean
# Default value: false
Enabled = false

## Which request shape to send. Voice APIs are NOT interchangeable the way
## chat APIs are - they differ in URL, body and even auth header - so this
## picks between them:
##   auto        work it out from the URL (recommended)
##   xai         api.x.ai/v1/tts - Bearer key, voice in the body
##   elevenlabs  /v1/text-to-speech/<voice> - xi-api-key header, voice in URL
##   openai      /v1/audio/speech - Bearer key; most other providers and
##               local servers copy this one
## Only set this by hand if auto-detection guesses wrong, which mainly happens
## with self-hosted endpoints whose address gives no clue.
# Setting type: String
# Default value: auto
Provider = auto

## Voice API root.
##   xAI         https://api.x.ai/v1
##   ElevenLabs  https://api.elevenlabs.io/v1
##   OpenAI      https://api.openai.com/v1
# Setting type: String
# Default value: https://api.x.ai/v1
BaseUrl = https://api.x.ai/v1

## Your voice provider's key - NOT the same as your text key above.
##   xAI         https://console.x.ai
##   ElevenLabs  https://elevenlabs.io  (Profile -> API Keys)
# Setting type: String
# Default value:
ApiKey =

## Which voice speaks.
##
## xAI has 26 built-in voices:
##   carina, zagan, helix, orion, luna, iris, altair, zenith, perseus,
##   helios, lux, kepler, rigel, cosmo, celeste, ursa, sirius, lumen,
##   castor, naksh, atlas, ara, eve, leo, rex, sal
##
## ElevenLabs wants a voice ID from your Voices page, e.g. EXAVITQu4vr4xnSDxMaL.
## Note that Voice Library voices need a PAID ElevenLabs plan; on the free tier
## the API returns 402 and the mod falls back to the local voice. Built-in
## voices such as Sarah (EXAVITQu4vr4xnSDxMaL) or Lily (pFZP5JQG7iQjIQuC4Bku)
## work on a free account.
# Setting type: String
# Default value: iris
VoiceId = iris

## Voice model name. Ignored by xAI, whose endpoint takes no model parameter.
## ElevenLabs needs one of its own (eleven_multilingual_v2, eleven_turbo_v2_5,
## eleven_v3); an OpenAI-style name here is swapped for eleven_multilingual_v2
## rather than sent and rejected.
# Setting type: String
# Default value: tts-1
Model = tts-1

## Bring every voice up to a consistent level. Providers hand back wildly
## different loudness - xAI's output is noticeably quieter than ElevenLabs' -
## so the clip is scaled by its own peak before playing.
# Setting type: Boolean
# Default value: true
NormalizeLoudness = true

## Extra gain applied after normalisation. 1.0 leaves it alone, 1.5 is half
## again as loud, 0.5 is half. Pushing well past 1.0 on an already-normalised
## clip will clip and distort.
# Setting type: Single
# Default value: 1
Volume = 1

## BCP-47 language code, or 'auto' to detect per line. Used by the xAI shape.
# Setting type: String
# Default value: en
Language = en

## Speaking rate baked into the audio. Below 1.0 slower, above faster.
# Setting type: Single
# Default value: 1
Speed = 1

## Output sample rate. Allowed: 8000, 16000, 22050, 24000, 44100, 48000.
# Setting type: Int32
# Default value: 24000
SampleRate = 24000

## Let the provider expand numbers and abbreviations into spoken form.
# Setting type: Boolean
# Default value: true
TextNormalization = true

## Press this key in-game to switch the cloud voice on or off without
## restarting. Turning it off stops that provider's billing immediately - she
## keeps talking, using the free on-device voice instead. Your choice is saved
## and survives a restart. Set to None to disable the hotkey.
# Setting type: KeyCode
# Default value: F8
ToggleKey = F8

[Debug]

## Write every prompt, reply, and cost line to BepInEx\LogOutput.log, plus a
## dump of the settings page layout. Leave on while setting up - it is how you
## confirm your key works and see what you are being charged. Turn off later
## for a smaller log.
# Setting type: Boolean
# Default value: true
LogPayloads = true
