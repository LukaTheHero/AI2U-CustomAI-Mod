[Memory]

## How much conversation the NPC keeps before the game deletes her oldest messages. This is memory, not reply length - it overrides the game's own 3072 cap, which is why she forgets the start of a long talk. A ceiling, not a reservation: cost only grows as the history actually fills. Keep it under the model's context window (Gemini 3.6 Flash: 1048576).
# Setting type: Int32
# Default value: 500000
HistoryMaxTokens = 500000

[Sampling]

## Sampling temperature.
# Setting type: Single
# Default value: 0.9
Temperature = 0.9

## Max tokens per reply. Reasoning models spend hidden tokens against this budget before emitting any JSON, so keep it generous. Below ~1500 Gemini 3.x returns nothing usable.
# Setting type: Int32
# Default value: 3000
MaxTokens = 3000

## Retries when the model returns unparseable JSON. Smaller models need more.
# Setting type: Int32
# Default value: 2
RetriesOnBadJson = 2

## Send reasoning.exclude so chain-of-thought is kept out of the reply. Required for Gemini 3.x and other reasoning models, which otherwise narrate instead of answering.
# Setting type: Boolean
# Default value: true
HideReasoning = true

## Send response_format=json_object. Tightens output, but some endpoints reject it.
# Setting type: Boolean
# Default value: false
ForceJsonMode = false

[Schema]

## Snap out-of-range enum fields onto the values the game actually understands. The allowed lists are read from the level's own system prompt, so this follows whichever level is loaded. Turn off only to debug what a model emits raw.
# Setting type: Boolean
# Default value: true
ClampToAllowedValues = true

[Voice]

## Switch the NPC to on-device Overtone TTS. Required when using a custom endpoint: the game normally plays base64 audio the AI2U server returns alongside the reply, and a custom endpoint cannot supply that, so the NPC would stay silent. Turn this off only if you have set your own Azure Speech key in the game's AI Setup page.
# Setting type: Boolean
# Default value: true
ForceLocalVoice = true

## Read stage directions out loud. Models in character write actions inline, like "*grabs the controller* almost got it". Off - the default - speaks only the words she actually says; the subtitle still shows the action, and a reply that is nothing but an action is skipped rather than synthesised as silence. Double asterisks are treated as emphasis on spoken words, so **those** are still read.
# Setting type: Boolean
# Default value: false
SpeakActions = false

