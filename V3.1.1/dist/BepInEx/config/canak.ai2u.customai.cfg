## Settings file was created by plugin AI2U Custom AI Endpoint v3.1.1
## Plugin GUID: canak.ai2u.customai

[Behaviour]

## Recover the character's persona, backstory and secrets from the game itself and send them with each request. The authored story guides come from the game's own localisation data and the per-playthrough answers - her computer password, the wifi password, the safe code, the potion recipe, which room was generated - come from the live context object the game builds for its own server. Without this she does not know her own name's worth of history and cannot answer questions about her own home. She is still told to withhold secrets until the player earns them.
# Setting type: Boolean
# Default value: true
SendCharacterLore = true

[Debug]

## Log outgoing prompts and raw replies to BepInEx\LogOutput.log.
# Setting type: Boolean
# Default value: true
LogPayloads = true

## Master switch for the test phrase below. Off, the phrase is never matched, never stripped and never consulted - the feature is fully absent from every code path, so a released copy behaves as though it was never written. On, TestKillPhrase fires the chase on demand. Disable while not testing: the phrase is matched as a substring ignoring spacing, so a short everyday phrase can fire from inside an ordinary line.
# Setting type: Boolean
# Default value: false
TestKillPhraseActive = false

## Typing this to her starts the final chase immediately, whatever her mood and whatever AiCanDecideToMurder says. It exists so the chase and her final line can be tested on demand rather than by trying to genuinely enrage her. Matched ignoring case, spaces and punctuation, so it still fires inside a sentence. Needs TestKillPhraseActive on.
# Setting type: String
# Default value: cocacolaisbetterthanpepsi
TestKillPhrase = cocacolaisbetterthanpepsi

## Master switch for the out-of-character developer channel. Off, the tag is never matched and not one word of its instructions enters the request, so typing it is just an ordinary sentence she reads in character - the feature is absent from every code path and costs nothing in her context. On, any message containing OocTag is answered out of character, as the model, truthfully, and carried out through the real fields.
# Setting type: Boolean
# Default value: true
OocModeActive = true

## The marker that switches one message to out-of-character mode. Matched anywhere in the message, ignoring case, and left in the text on purpose so the model can see which message carries it. Applies to that message only; the next untagged line is fully back in character. Needs OocModeActive on.
# Setting type: String
# Default value: [OOC]
OocTag = [OOC]

[Endpoint]

## OpenAI-compatible base URL. '/chat/completions' is appended automatically.
# Setting type: String
# Default value: https://openrouter.ai/api/v1
BaseUrl = https://openrouter.ai/api/v1

## Your API key, sent as 'Authorization: Bearer <key>'.
# Setting type: String
# Default value: 
ApiKey =

## Model identifier passed to the endpoint.
# Setting type: String
# Default value: google/gemini-3.6-flash
Model = google/gemini-3.6-flash

[General]

## Route NPC dialogue to your own OpenAI-compatible endpoint instead of the AI2U game server.
# Setting type: Boolean
# Default value: true
Enabled = true

