## While the mod is enabled, stop the game from calling AI2U's own dialogue AI servers. The mod already answers every line itself, so those calls would be paid for by the developers and thrown away. Leave this on.
# Setting type: Boolean
# Default value: true
BlockGameDialogueAI = true

## Let her decide to start the final chase herself, instead of only the game's anger and trust thresholds deciding it. The prompt restricts it to the extreme case - she is convinced you mean to leave for good, hate her, or intend to harm her - and one rude line is explicitly not enough. The game's own triggers stay exactly as they are; this only adds one. Turn it off for a version that can never kill you unprompted.
# Setting type: Boolean
# Default value: false
AiCanDecideToMurder = false

## Also block AI2U's summary, envision and memorize calls. These are their paid LLM endpoints too, but unlike dialogue the mod does not replace them, so blocking them means those features error instead of working. Off by default: correctness first, and they are a rounding error next to per-line dialogue cost.
# Setting type: Boolean
# Default value: false
BlockGameSummaryAI = false

[GrokTTS]

## Speak her lines with a cloud text-to-speech service instead of the on-device voice. Costs money at whichever provider you point it at, so it is off by default. When a request fails the mod falls back to the local voice rather than going silent.
# Setting type: Boolean
# Default value: false
Enabled = false

## Which request shape to send, because voice APIs are not interchangeable the way chat APIs are:
##   auto        work it out from the URL (recommended)
##   xai         api.x.ai/v1/tts - Bearer key, voice in the body
##   elevenlabs  /v1/text-to-speech/<voice> - xi-api-key header, voice in the URL
##   openai      /v1/audio/speech - Bearer key; most other providers and local
##               servers copy this one
## Only set this by hand if auto-detection guesses wrong, which mainly happens with self-hosted endpoints whose address gives no clue.
# Setting type: String
# Default value: auto
Provider = auto

## Voice model name. Ignored by xAI, whose endpoint takes no model parameter. ElevenLabs needs one of its own (eleven_multilingual_v2, eleven_turbo_v2_5, ...); an OpenAI-style name here is swapped for eleven_multilingual_v2 rather than sent and rejected.
# Setting type: String
# Default value: tts-1
Model = tts-1

## xAI API root. '/tts' is appended automatically.
# Setting type: String
# Default value: https://api.x.ai/v1
BaseUrl = https://api.x.ai/v1

## Your xAI API key, sent as 'Authorization: Bearer <key>'. Separate from the text key above - this one is billed by xAI, not OpenRouter.
# Setting type: String
# Default value: 
ApiKey =

## Built-in voice or a custom voice ID. The 26 stock voices: carina, zagan, helix, orion, luna, iris, altair, zenith, perseus, helios, lux, kepler, rigel, cosmo, celeste, ursa, sirius, lumen, castor, naksh, atlas, ara, eve, leo, rex, sal.
# Setting type: String
# Default value: iris
VoiceId = iris

## BCP-47 language code, or 'auto' to detect per line. xAI requires this field.
# Setting type: String
# Default value: en
Language = en

## Playback rate baked into the synthesis. Below 1.0 is slower, above is faster.
# Setting type: Single
# Default value: 1
Speed = 1

## Output sample rate. Allowed: 8000, 16000, 22050, 24000, 44100, 48000.
# Setting type: Int32
# Default value: 24000
SampleRate = 24000

## Let xAI expand numbers and abbreviations into spoken form before synthesis.
# Setting type: Boolean
# Default value: true
TextNormalization = true

## Bring every voice up to a consistent level. Providers hand back wildly different loudness - xAI's output is noticeably quieter than ElevenLabs' - so the clip is scaled by its own peak before playing. Turn off if you would rather set the level yourself with Volume below.
# Setting type: Boolean
# Default value: true
NormalizeLoudness = true

## Extra gain applied after normalisation. 1.0 leaves it alone, 1.5 is half again as loud, 0.5 is half. Pushing well past 1.0 on an already-normalised clip will clip and distort.
# Setting type: Single
# Default value: 1
Volume = 1

