<!doctype html>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1300px;height:372px;overflow:hidden}
  body{
    position:relative;
    background:
      radial-gradient(680px 380px at 82% 12%, rgba(226,164,214,.30), transparent 68%),
      radial-gradient(560px 340px at 14% 88%, rgba(150,208,226,.22), transparent 70%),
      radial-gradient(900px 500px at 50% 120%, rgba(190,150,224,.26), transparent 72%),
      linear-gradient(165deg,#241b41 0%,#2c2050 42%,#382a63 78%,#2a1f4a 100%);
    font-family:Georgia,'Book Antiqua',serif;
  }
  #stars{position:absolute;inset:0}
  .s{position:absolute;background:#fff;border-radius:50%}
  /* soft moon */
  .moon{position:absolute;right:112px;top:76px;width:96px;height:96px;border-radius:50%;
    background:radial-gradient(circle at 42% 38%,#fffdf8 0%,#fdf2f9 46%,#f4dcef 74%,#e8c8e4 100%);
    box-shadow:0 0 34px 6px rgba(255,235,250,.55),0 0 110px 42px rgba(240,198,236,.20)}
  .halo{position:absolute;right:52px;top:16px;width:216px;height:216px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,226,248,.20),rgba(255,226,248,.07) 45%,transparent 68%)}
  .wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;
    padding:0 74px}
  .kicker{font-family:'Segoe UI',sans-serif;font-size:15px;letter-spacing:.34em;text-transform:uppercase;
    color:#c9b6e8;margin-bottom:14px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
  h1{font-size:74px;line-height:1.02;color:#fff;letter-spacing:-.5px;
    text-shadow:0 3px 26px rgba(232,165,200,.55),0 2px 4px rgba(0,0,0,.55)}
  h1 .pink{color:#f2b8da}
  .sub{margin-top:16px;font-size:25px;font-style:italic;color:#e6d9f7;
    text-shadow:0 2px 10px rgba(0,0,0,.55)}
  .pills{margin-top:24px;display:flex;gap:11px}
  .p{font-family:'Segoe UI',sans-serif;font-size:14.5px;font-weight:600;color:#f6ecff;
    padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.11);
    border:1px solid rgba(242,184,218,.42);backdrop-filter:blur(2px);
    text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .ver{position:absolute;right:74px;bottom:26px;text-align:right;font-family:'Segoe UI',sans-serif}
  .ver b{display:block;font-size:17px;color:#f2b8da;letter-spacing:.06em}
  .ver span{font-size:13px;color:#b9a6d8}
  .glow{position:absolute;left:0;right:0;bottom:0;height:3px;
    background:linear-gradient(90deg,transparent,#f2b8da,#a9d4e8,transparent);opacity:.85}
</style>
<div id="stars"></div>
<div class="halo"></div>
<div class="moon"></div>
<div class="wrap">
  <div class="kicker">BepInEx plugin &nbsp;·&nbsp; AI2U — With you til the end</div>
  <h1>Custom <span class="pink">AI Endpoint</span></h1>
  <div class="sub">Your own AI. Your own model. Your own voice.</div>
  <div class="pills">
    <div class="p">Any OpenAI-compatible endpoint</div>
    <div class="p">500,000-token memory</div>
    <div class="p">Actions that actually work</div>
    <div class="p">Grok &amp; ElevenLabs voice</div>
  </div>
</div>
<div class="ver"><b>GAME v0.1.46</b><span>Unity 2022.3.62 · Mono</span></div>
<div class="glow"></div>
<script>
  let s=987654321;
  const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff};
  const box=document.getElementById('stars');
  for(let i=0;i<190;i++){
    const d=document.createElement('div');d.className='s';
    const sz=rnd()*2.1+0.5, y=rnd();
    d.style.width=d.style.height=sz.toFixed(2)+'px';
    d.style.left=(rnd()*100).toFixed(2)+'%';
    d.style.top=(y*88).toFixed(2)+'%';
    d.style.opacity=(0.20+rnd()*0.75).toFixed(2);
    if(sz>2.0)d.style.boxShadow='0 0 6px 1px rgba(255,255,255,.7)';
    box.appendChild(d);
  }
</script>
